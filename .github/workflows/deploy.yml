name: CI/CD Build & Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install & Build Frontend SPA
      working-directory: frontend
      run: |
        npm install
        npm run build

    - name: Install & Build Backend Server
      working-directory: server
      run: |
        npm install
        npm run build
