<!DOCTYPE html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fa" />
    <meta name="description" content="iTorgo — Kırgızistan'ın Önde Gelen Gerçek Zamanlı Açık Artırma Platformu. MBank, Optima Bank, DemirBank entegrasyonlu. KGS para birimi." />
    <title>iTorgo — Real-Time Auction Platform</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext,latin">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext,latin" media="print" onload="this.media='all'">
    <script>
      document.documentElement.classList.add('fonts-pending');
      const fontLoadTimeout = setTimeout(() => {
        document.documentElement.classList.remove('fonts-pending');
        document.documentElement.classList.add('fonts-ready');
      }, 2500);
      Promise.all([
        document.fonts.load('400 1em "Poppins"'),
        document.fonts.load('600 1em "Poppins"'),
        document.fonts.load('700 1em "Poppins"'),
        document.fonts.load('400 1em "JetBrains Mono"')
      ]).then(() => {
        clearTimeout(fontLoadTimeout);
        document.documentElement.classList.remove('fonts-pending');
        document.documentElement.classList.add('fonts-ready');
      }).catch(() => {
        clearTimeout(fontLoadTimeout);
        document.documentElement.classList.remove('fonts-pending');
        document.documentElement.classList.add('fonts-ready');
      });
    </script>
  </head>
  <body class="min-h-screen bg-background text-text-primary antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
