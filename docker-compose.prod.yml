# Auktsion v2.0 — Production Docker Compose
# Stack: Node/Express + PostgreSQL + Redis + Meilisearch + Nginx
# Usage: docker compose -f docker-compose.prod.yml up -d

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # APP: Node/Express API + WebSocket Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    image: auktsion/app:latest
    container_name: auktsion-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=https://${DOMAIN:-auktsion.kg}
      - ADMIN_HOST=admin.${DOMAIN:-auktsion.kg}
      - DATABASE_URL=postgresql://${DB_USER:-auktsion}:${DB_PASSWORD}@db:5432/${DB_NAME:-auktsion}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SEED_ADMIN=${SEED_ADMIN:-false}
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # DB: PostgreSQL 16 (Primary)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: auktsion-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-auktsion}
      - POSTGRES_USER=${DB_USER:-auktsion}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro  # Migration scripts (future)
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auktsion} -d ${DB_NAME:-auktsion}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ---------------------------------------------------------------------------
  # REDIS: Session store, rate limiting, caching, WebSocket pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auktsion-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # MEILISEARCH: Full-text search (ru/ky/tr analyzers)
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: auktsion-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # NGINX: Reverse proxy + SSL termination + Static files + Rate limiting
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: auktsion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - app_uploads:/var/www/uploads:ro
      - frontend_dist:/var/www/frontend:ro
      - admin_dist:/var/www/admin:ro
    depends_on:
      - app
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # FRONTEND BUILD (one-shot, populates frontend_dist volume)
  # ---------------------------------------------------------------------------
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: auktsion/frontend-builder:latest
    container_name: auktsion-frontend-build
    environment:
      - VITE_API_URL=https://${DOMAIN:-auktsion.kg}/api
      - VITE_WS_URL=wss://${DOMAIN:-auktsion.kg}/ws
    volumes:
      - frontend_dist:/app/dist
    networks:
      - backend
    profiles:
      - build
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ---------------------------------------------------------------------------
  # ADMIN BUILD (one-shot, populates admin_dist volume)
  # ---------------------------------------------------------------------------
  admin-build:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: builder
    image: auktsion/admin-builder:latest
    container_name: auktsion-admin-build
    environment:
      - VITE_API_URL=https://${DOMAIN:-auktsion.kg}/api
      - VITE_WS_URL=wss://${DOMAIN:-auktsion.kg}/ws
    volumes:
      - admin_dist:/app/dist
    networks:
      - backend
    profiles:
      - build
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  app_uploads:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local
  db_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
  frontend_dist:
    driver: local
  admin_dist:
    driver: local

# ---------------------------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------------------------
networks:
  backend:
    driver: bridge
    name: auktsion-backend
  frontend:
    driver: bridge
    name: auktsion-frontend